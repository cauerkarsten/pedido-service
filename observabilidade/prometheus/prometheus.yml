global:
  scrape_interval: 15s
  # O Render grátis pode levar ~1 min para acordar um serviço
  scrape_timeout: 10s

# Endereços dos serviços publicados no Render (sem https://)
scrape_configs:
  - job_name: estoque-dev
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["estoque-dev-xraj.onrender.com"]

  - job_name: estoque-homol
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["estoque-homol-e6on.onrender.com"]

  - job_name: pedido-dev
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["pedido-service-lzk8.onrender.com"]

  - job_name: pedido-homol
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["pedido-homol-c247.onrender.com"]
